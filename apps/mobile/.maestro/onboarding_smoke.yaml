appId: com.qalitylabs.tolle
name: Smoke - demarrage app et navigation vers login
tags:
  - smoke
# Test de non-regression minimal, SANS backend :
#   verifie que l'app se lance, affiche l'onboarding, et navigue vers le login.
# Suffit a detecter un crash au demarrage / un ecran blanc / un routing casse
# (les regressions les plus graves) sans dependre du reseau ni d'un compte.
---
# clearState garantit un premier lancement -> l'onboarding s'affiche toujours,
# quel que soit l'etat laisse par un run precedent.
- launchApp:
    clearState: true

# --- Onboarding ---
# Titre du 1er slide (texte stable). Timeout large : sur emulateur froid + Metro
# bundle, le premier rendu peut prendre quelques secondes.
- assertVisible:
    text: "Envoyez en un clic"
    timeout: 30000

# Bouton "Passer" present sur les slides non-finaux -> saute directement au login.
- tapOn:
    text: "Passer"

# --- Ecran de login ---
# Deux ancres stables de l'ecran de connexion (label du champ + lien inscription).
- assertVisible:
    text: "Numéro de téléphone"
    timeout: 15000
- assertVisible:
    text: "S'inscrire"
